# ==================== JVM ====================
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# ==================== Android ====================
android.useAndroidX=true
android.nonTransitiveRClass=true

# 本项目所在路径包含中文（D:\pwg\监管软件），AGP 默认会因此拒绝构建。
# 打开此开关可绕过路径检查；若后续某个工具链（aapt2 / NDK）仍因非 ASCII 路径报错，
# 请改用 ASCII 路径的目录联接（junction）构建，见 README「非 ASCII 路径」一节。
android.overridePathCheck=true

kotlin.code.style=official

# ==================== 服务器默认配置（已脱敏）====================
# 此处只是「编译期默认值」，优先级最低：
#   本机私有覆盖(local.properties) > 配对页/设置页手填 > DataStore 运行期值 > 此处
# 本文件会随代码库一起分享，因此**不要在这里写真实服务器地址**。
# 真实地址请写进 android/local.properties（已在 .gitignore 中，不会入库）：
#   SERVER_HOST=<你的服务器 IP 或域名>
#   SERVER_PORT=8111
#   SERVER_SCHEME=http
# 下面的 203.0.113.10 是 RFC 5737 文档专用示例地址，仅作占位。
# 端口默认 8111：与 deploy/.env.example 的 APP_PORT 保持一致
# （8080 在不少服务器上已被占用；服务端对外端口在 .env 的 APP_PORT 修改）
SERVER_HOST=203.0.113.10
SERVER_PORT=8111
SERVER_SCHEME=http
